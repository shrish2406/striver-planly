<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DSA Sprint Planner</title>
    <style>
      :root {
        --bg: #05070d;
        --card: #0b1120;
        --card2: #0f1830;
        --line: #16264a;
        --blue: #2f7bff;
        --blue2: #5aa2ff;
        --glow: rgba(47, 123, 255, 0.35);
        --tx: #e6eeff;
        --mut: #7f93bd;
        --ok: #2fd1a0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: radial-gradient(
            1000px 500px at 80% -10%,
            #0b1c44 0,
            transparent 60%
          ),
          var(--bg);
        color: var(--tx);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        min-height: 100%;
      }
      .wrap {
        max-width: 1150px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 4px;
        letter-spacing: -0.5px;
      }
      h1 span {
        color: var(--blue2);
      }
      .sub {
        color: var(--mut);
        font-size: 14px;
        margin-bottom: 18px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .st {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .st b {
        display: block;
        font-size: 24px;
        color: var(--blue2);
      }
      .st small {
        color: var(--mut);
      }
      .bar {
        height: 8px;
        background: #0d1a38;
        border-radius: 99px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--blue2));
        box-shadow: 0 0 12px var(--glow);
        transition: width 0.3s;
      }
      .main {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 16px;
      }
      .main .row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--mut);
        margin-bottom: 8px;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .chip,
      .btn {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--line);
        padding: 7px 13px;
        border-radius: 99px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      .chip:hover,
      .btn:hover {
        border-color: var(--blue);
      }
      .chip.on {
        background: var(--blue);
        border-color: var(--blue);
        box-shadow: 0 0 14px var(--glow);
        color: #fff;
      }
      input[type='search'] {
        flex: 1;
        min-width: 160px;
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 99px;
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }
      input[type='search']:focus {
        border-color: var(--blue);
      }
      .sp {
        margin-top: 22px;
      }
      .sph {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .sph h2 {
        margin: 0;
        font-size: 18px;
      }
      .sph h2 em {
        font-style: normal;
        color: var(--blue2);
      }
      .sph span {
        color: var(--mut);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
        margin-top: 10px;
      }
      .day {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 13px;
      }
      .day.today {
        border-color: var(--blue);
        box-shadow: 0 0 0 1px var(--blue), 0 0 20px var(--glow);
      }
      .day.done {
        background: var(--card2);
      }
      .dh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .dh b {
        font-size: 14px;
      }
      .dh small {
        color: var(--mut);
        font-size: 11px;
        display: block;
      }
      .badge {
        font-size: 10px;
        background: var(--blue);
        color: #fff;
        padding: 2px 7px;
        border-radius: 99px;
        margin-left: 6px;
      }
      .pct {
        font-size: 12px;
        color: var(--blue2);
        font-weight: 600;
      }
      .day.done .pct {
        color: var(--ok);
      }
      .t {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 7px 4px;
        border-top: 1px solid #101c3a;
        cursor: pointer;
        font-size: 13px;
        line-height: 1.35;
      }
      .t input {
        appearance: none;
        width: 17px;
        height: 17px;
        border: 1.5px solid var(--blue);
        border-radius: 5px;
        flex: none;
        margin: 1px 0 0;
        cursor: pointer;
        background: transparent;
        position: relative;
      }
      .t input:checked {
        background: var(--blue);
        box-shadow: 0 0 8px var(--glow);
      }
      .t input:checked::after {
        content: '';
        position: absolute;
        left: 4.5px;
        top: 1px;
        width: 4px;
        height: 9px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .t.x span {
        color: var(--mut);
        text-decoration: line-through;
      }
      .t span {
        flex: 1;
      }
      .tag {
        display: block;
        color: var(--blue);
        font-size: 10.5px;
        margin-top: 2px;
      }
      .tg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .tc {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        cursor: pointer;
      }
      .tc:hover {
        border-color: var(--blue);
      }
      .tc.on {
        border-color: var(--blue);
        box-shadow: 0 0 0 1px var(--blue), 0 0 14px var(--glow);
      }
      .tc .r {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 7px;
      }
      .tc .r span {
        color: var(--blue2);
        font-weight: 600;
      }
      .t a {
        color: inherit;
        text-decoration: none;
      }
      .t a:hover {
        color: var(--blue2);
        text-decoration: underline;
      }
      .t a::after {
        content: ' ↗';
        color: var(--blue);
        font-size: 11px;
      }
      .t em {
        font-style: normal;
        color: var(--mut);
        font-size: 11px;
        white-space: nowrap;
      }
      .empty {
        color: var(--mut);
        text-align: center;
        padding: 40px;
      }
    </style>
  </head>

      const days = []
      for (let i = 0, k = 0; i < flat.length; k++) {
        const av = k % 2 ? 60 : 120,
          tasks = []
        let sum = 0
        while (
          i < flat.length &&
          tasks.length < 4 &&
          (!tasks.length || sum + flat[i].min <= av + 5)
        ) {
          sum += flat[i].min
          tasks.push(flat[i++])
        }
        const d = new Date(START + k * 864e5)
        days.push({
          n: k + 1,
          sprint: Math.floor(k / 7) + 1,
          date: d,
          key: d.toISOString().slice(0, 10),
          avail: av,
          tasks
        })
      }

        E.getUTCDate() +
        ' ' +
        MO[E.getUTCMonth()] +
        ' 2026 · max 4 questions/day · 2h and 1h days alternate'
      const all = days.flatMap(d => d.tasks)
      let done = {}
      try {
        const n = localStorage.getItem('dsa-done2')
        if (n) done = JSON.parse(n)
        else {
          const o = JSON.parse(localStorage.getItem('dsa-done') || '{}'),
            L = RAW.split('\n').map(l => l.split(';').length)
          for (const k in o) {
            const [d, j] = k.split('.')
            done['q' + (L.slice(0, d - 1).reduce((a, b) => a + b, 0) + +j)] = 1
          }
        }
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem('dsa-done2', JSON.stringify(done))
        } catch (e) {}
      }
      let sprint = 0,
        filter = 'all',
        query = '',
        topic = ''
      const $ = s => document.querySelector(s)
      const todayKey = new Date().toISOString().slice(0, 10)
      const fmt = m =>
        m >= 60
          ? Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '')
          : m + 'm'
      function stats() {
        const d = all.filter(t => done[t.id]),
          tm = all.reduce((a, t) => a + t.min, 0),
          dm = d.reduce((a, t) => a + t.min, 0)
        const fullDays = days.filter(x => x.tasks.every(t => done[t.id])).length
        const p = Math.round((d.length / all.length) * 100)
        $('#stats').innerHTML = [
          [d.length + ' / ' + all.length, 'Questions solved'],
          [fullDays + ' / ' + days.length, 'Days completed'],
          [fmt(dm), 'Time done of ' + fmt(tm)],
          [p + '%', 'Plan complete']
        ]
          .map(
            x => `<div class="st"><b>${x[0]}</b><small>${x[1]}</small></div>`
          )
          .join('')
        $('#pbar').style.width = p + '%'
        $('#ptxt').textContent = p + '%'
        $('#topics').innerHTML = TOPICS.map(n => {
          const ts = flat.filter(t => t.topic == n),
            c = ts.filter(t => done[t.id]).length
          return `<div class="tc ${
            topic == n ? 'on' : ''
          }" data-t="${n}"><div class="r"><b>${n}</b><span>${c}/${
            ts.length
          }</span></div><div class="bar"><i style="width:${
            (c / ts.length) * 100
          }%"></i></div></div>`
        }).join('')
      }
      function chips() {
        let h = `<button class="chip ${
          sprint == 0 ? 'on' : ''
        }" data-s="0">All sprints</button>`
        for (let s = 1; s <= NS; s++)
          h += `<button class="chip ${
            sprint == s ? 'on' : ''
          }" data-s="${s}">Sprint ${s}</button>`
        $('#sprintChips').innerHTML = h
      }
      function render() {
        stats()
        chips()
        let h = ''
        for (let s = 1; s <= NS; s++) {
          if (sprint && sprint != s) continue
          const ds = days.filter(d => d.sprint == s)
          const ts = ds.flatMap(d => d.tasks),
            dn = ts.filter(t => done[t.id]).length
          let cards = ''
          for (const d of ds) {
            const vis = d.tasks.filter(
              t =>
                (filter == 'all' || (filter == 'done') == !!done[t.id]) &&
                t.name.toLowerCase().includes(query) &&
                (!topic || t.topic == topic)
            )
            if (!vis.length) continue
            const c = d.tasks.filter(t => done[t.id]).length,
              all_ = c == d.tasks.length
            const est = d.tasks.reduce((a, t) => a + t.min, 0)
            cards += `<div class="day ${d.key == todayKey ? 'today' : ''} ${
              all_ ? 'done' : ''
            }">
      <div class="dh"><div><b>Day ${d.n}${
              d.key == todayKey ? '<span class="badge">TODAY</span>' : ''
            }</b><small>${WD[d.date.getUTCDay()]}, ${d.date.getUTCDate()} ${
              MO[d.date.getUTCMonth()]
            } · ${fmt(est)} of ${fmt(
              d.avail
            )}</small></div><span class="pct">${c}/${
              d.tasks.length
            }</span></div>
      <div class="bar" style="margin-bottom:6px"><i style="width:${
        (c / d.tasks.length) * 100
      }%"></i></div>
      ${vis
        .map(
          t =>
            `<label class="t ${
              done[t.id] ? 'x' : ''
            }"><input type="checkbox" data-id="${t.id}" ${
              done[t.id] ? 'checked' : ''
            }><span><a href="${lc(t)}" target="_blank" rel="noopener">${
              t.name
            }</a><small class="tag">${t.topic}</small></span><em>${
              t.min
            }m</em></label>`
        )
        .join('')}</div>`
          }
          if (!cards) continue
          h += `<section class="sp"><div class="sph"><h2>Sprint <em>${s}</em></h2><span>${dn}/${
            ts.length
          } solved · ${fmt(
            ts.reduce((a, t) => a + t.min, 0)
          )} total</span></div><div class="bar"><i style="width:${
            (dn / ts.length) * 100
          }%"></i></div><div class="grid">${cards}</div></section>`
        }
        $('#out').innerHTML =
          h || '<div class="empty">No questions match.</div>'
      }
      document.addEventListener('change', e => {
        const id = e.target.dataset && e.target.dataset.id
        if (!id) return
        e.target.checked ? (done[id] = 1) : delete done[id]
        save()
        render()
      })
      document.addEventListener('click', e => {
        const s = e.target.dataset.s,
          f = e.target.dataset.f
        if (s !== undefined) {
          sprint = +s
          render()
        }
        if (f) {
          filter = f
          document
            .querySelectorAll('[data-f]')
            .forEach(b => b.classList.toggle('on', b.dataset.f == f))
          render()
        }
      })
      document.addEventListener('click', e => {
        const c = e.target.closest('[data-t]')
        if (c) {
          topic = topic == c.dataset.t ? '' : c.dataset.t
          render()
        }
      })
      $('#q').addEventListener('input', e => {
        query = e.target.value.toLowerCase()
        render()
      })
      $('#reset').addEventListener('click', () => {
        if (confirm('Clear all solved progress?')) {
          done = {}
          save()
          render()
        }
      })
      render()
    </script>
  </body>
</html>
